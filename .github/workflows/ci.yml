name: M2 Portfolio Agent
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: m2d_test
          POSTGRES_USER: m2d
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U m2d -d m2d_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MARKET_PROVIDER: fixture
      LISTING_PROVIDER: fixture
      RESEARCH_PROVIDER: fixture
      LLM_PROVIDER: fixture
      LLM_MODEL: fixture-v1
      TEST_DATABASE_URL: postgresql://m2d:test-only@localhost:5432/m2d_test
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_ALLOW_PORTFOLIO_WRITES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm docs:erd:check
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: always()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
